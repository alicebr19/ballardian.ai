<style>
/* Layout idea: a clinical white page laid over a pile of Ballard paperbacks.
   Black cover-label masthead, file tabs, one reading column. Single theme by choice. */
:root {
  color-scheme: light;
  --ink: #101012;
  --paper: #f6f5f0;
  --paper-2: #ebe9e1;
  --line: #d4d1c6;
  --muted: #63625c;
  --signal: #d9112a;      /* the red of the Empire of the Sun and High-Rise jackets */
  --sodium: #f26a1b;      /* Penguin orange */
  --cold: #0f6f7c;        /* the green-blue of the 1970s Penguin spines */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #0b0b0c; color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background:
    linear-gradient(rgba(11,11,12,.18), rgba(11,11,12,.5)),
    #0b0b0c url("collage.jpg") center / cover no-repeat;
}
a { color: inherit; }
img { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sodium); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

/* Masthead */
.mast { padding: clamp(28px, 7vw, 72px) 0 clamp(20px, 4vw, 36px); }
.label { display: inline-block; background: var(--ink); color: #fff; padding: 16px 22px 14px; text-decoration: none; border-left: 10px solid var(--signal); }
.wordmark { font-family: var(--display); font-stretch: 62%; font-weight: 800; font-size: clamp(46px, 11vw, 104px); line-height: .88; letter-spacing: .005em; text-transform: uppercase; margin: 0; }
.tagline { font-family: var(--display); font-stretch: 100%; font-weight: 300; font-size: clamp(15px, 2.4vw, 19px); margin: 10px 0 0; letter-spacing: .01em; }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
.tab { font-family: var(--mono); font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; text-decoration: none; background: var(--ink); color: #fff; padding: 12px 16px 10px; border: 0; cursor: pointer; }
.tab:hover { background: #2a2a2e; }
.tab[aria-current="page"] { background: var(--paper); color: var(--ink); padding-bottom: 14px; }
.tab.right { margin-left: auto; }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); margin-right: 8px; vertical-align: 1px; }

/* Paper */
.paper { background: var(--paper); padding: clamp(22px, 5.5vw, 60px); min-height: 60vh; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.notice { font-family: var(--mono); font-size: 12.5px; background: var(--ink); color: #fff; padding: 9px 14px; margin: 0; }
.notice b { color: var(--sodium); font-weight: 500; }

h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.meta a { text-decoration: none; border-bottom: 1px solid var(--line); }
.meta a:hover { border-color: var(--ink); color: var(--ink); }
.tag { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 1px 7px; background: none; cursor: pointer; }
.tag.on, .tag.sample { background: var(--ink); color: #fff; }
.tag.sample { border-color: var(--ink); cursor: default; }
.xh { color: var(--cold); }

.head { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 3px solid var(--ink); margin-bottom: 6px; }
.head h1 { font-stretch: 75%; font-weight: 750; font-size: clamp(30px, 6vw, 46px); line-height: 1; text-transform: uppercase; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Buttons and fields */
.btn { font-family: var(--mono); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; background: var(--ink); color: #fff; border: 1.5px solid var(--ink); padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.2; }
.btn:hover { background: var(--signal); border-color: var(--signal); }
.btn.ghost { background: none; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.small { padding: 6px 10px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkbtn { font-family: var(--mono); font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; border-bottom: 1px solid var(--line); }
.linkbtn:hover { color: var(--ink); border-color: var(--ink); }
.linkbtn.danger:hover { color: var(--signal); border-color: var(--signal); }
label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
input[type="text"], input[type="email"], textarea { width: 100%; background: #fff; border: 1.5px solid var(--ink); padding: 10px 12px; border-radius: 0; font-family: var(--body); font-size: 18px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.field { margin-bottom: 16px; }
.hint { font-size: 15px; color: var(--muted); margin: 6px 0 0; }
.form { display: grid; gap: 4px; max-width: 640px; }
.status { font-family: var(--mono); font-size: 13px; margin: 10px 0 0; min-height: 1.3em; }
.status.err { color: var(--signal); }
.status.ok { color: var(--cold); }
.empty { padding: 36px 0; color: var(--muted); font-style: italic; }

/* Essays */
.essay-list { list-style: none; margin: 0; padding: 0; }
.essay-list li { padding: 26px 0; border-bottom: 1px solid var(--line); }
.essay-list a.t { text-decoration: none; display: block; }
.essay-list h2 { font-stretch: 88%; font-weight: 700; font-size: clamp(25px, 4.4vw, 34px); line-height: 1.08; }
.essay-list a.t:hover h2 { color: var(--signal); }
.essay-list .sub { font-style: italic; font-size: 20px; color: #3b3a36; margin: 6px 0 0; }
.essay-list .ex { margin: 10px 0 12px; color: #3b3a36; max-width: 62ch; }
.subscribe { margin-top: 36px; padding: 22px; background: var(--paper-2); border-left: 10px solid var(--ink); }
.subscribe h3 { font-stretch: 88%; font-weight: 700; font-size: 20px; margin-bottom: 10px; }
.subscribe .row input { flex: 1 1 240px; width: auto; }

.essay { max-width: 34em; margin: 0 auto; }
.essay header { margin-bottom: 30px; }
.essay h1 { font-stretch: 86%; font-weight: 750; font-size: clamp(34px, 7vw, 54px); line-height: 1.02; margin: 12px 0 0; }
.essay .sub { font-style: italic; font-size: clamp(20px, 3.4vw, 24px); line-height: 1.3; color: #3b3a36; margin: 12px 0 18px; }
.prose { font-size: 20px; line-height: 1.62; overflow-wrap: break-word; }
.prose p { margin: 0 0 1.05em; }
.prose h2 { font-stretch: 88%; font-weight: 700; font-size: 27px; line-height: 1.15; margin: 1.6em 0 .5em; }
.prose h3 { font-stretch: 88%; font-weight: 700; font-size: 21px; margin: 1.4em 0 .4em; }
.prose blockquote { margin: 1.2em 0; padding: 2px 0 2px 18px; border-left: 4px solid var(--signal); font-style: italic; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { padding-left: 1.2em; margin: 0 0 1.05em; }
.prose a { color: var(--ink); text-decoration-color: var(--signal); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.prose a:hover { color: var(--signal); }
.prose code { font-family: var(--mono); font-size: .82em; background: var(--paper-2); padding: 1px 5px; }
.prose hr { border: 0; border-top: 1px solid var(--ink); width: 80px; margin: 2em auto; }
.prose.small { font-size: 17.5px; line-height: 1.55; }
.prose.small p { margin-bottom: .7em; }
.prose.small p:last-child { margin-bottom: 0; }
.actions { margin-top: 34px; padding-top: 18px; border-top: 3px solid var(--ink); }
.back { font-family: var(--mono); font-size: 12.5px; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--ink); }

/* Threads */
.sorts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 16px 0 4px; }
.composer { background: var(--paper-2); padding: 20px; margin: 16px 0 8px; border-left: 10px solid var(--ink); }
.t-list { list-style: none; margin: 0; padding: 0; }
.t-row { display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.votes { display: grid; justify-items: center; align-content: start; gap: 1px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.votes button { background: none; border: 0; cursor: pointer; padding: 4px 8px; line-height: 0; color: #a3a198; }
.votes button:hover { color: var(--ink); }
.votes button svg { width: 16px; height: 10px; display: block; }
.votes .up[aria-pressed="true"] { color: var(--signal); }
.votes .down[aria-pressed="true"] { color: var(--cold); }
.votes .n { font-size: 14px; font-weight: 500; }
.t-row h2 { font-stretch: 92%; font-weight: 650; font-size: 21px; line-height: 1.2; }
.t-row h2 a { text-decoration: none; }
.t-row h2 a:hover { color: var(--signal); }
.t-row .meta { margin-top: 7px; }
.thread-top { display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 4px 0 22px; border-bottom: 3px solid var(--ink); }
.thread-top h1 { font-stretch: 90%; font-weight: 700; font-size: clamp(25px, 5vw, 34px); line-height: 1.1; margin-bottom: 8px; }
.thread-top .prose { margin-top: 14px; max-width: 64ch; }
.replies { list-style: none; margin: 0; padding: 0; }
.reply { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 16px 0 0; }
.reply .votes button { padding: 3px 6px; }
.reply .votes button svg { width: 13px; height: 8px; }
.reply .votes .n { font-size: 12.5px; }
.reply .body { max-width: 64ch; margin-top: 5px; }
.reply .kids { list-style: none; margin: 0; padding: 0 0 0 clamp(8px, 2.2vw, 20px); border-left: 2px solid var(--line); grid-column: 1 / -1; }
.reply .tools { display: flex; gap: 14px; margin-top: 7px; }
.replybox { margin-top: 10px; max-width: 64ch; }
.replybox textarea { min-height: 84px; font-size: 17px; }

/* J.G. Ballard */
.jgb-head { border-bottom: 3px solid var(--ink); padding-bottom: 20px; }
.jgb-head h1 { font-stretch: 62%; font-weight: 800; font-size: clamp(52px, 13vw, 124px); line-height: .86; text-transform: uppercase; }
.jgb-head .years { font-family: var(--display); font-stretch: 100%; font-weight: 300; font-size: clamp(22px, 4.6vw, 38px); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
.jgb { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 56px); margin-top: 28px; }
.jgb h2 { font-family: var(--mono); font-weight: 500; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); margin: 30px 0 12px; }
.jgb section > h2:first-child { margin-top: 0; }
.jgb .lede { font-size: 22px; line-height: 1.45; margin: 0 0 1em; }
.jgb p { margin: 0 0 1em; }
.years-list { list-style: none; margin: 0; padding: 0; }
.years-list li { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.years-list .y { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 3px; }
.years-list i { font-style: italic; }
.years-list.books li { grid-template-columns: 3.4em 1fr; padding: 5px 0; }

/* Account */
.panel { border-top: 3px solid var(--ink); padding-top: 18px; margin-top: 34px; }
.panel > h2 { font-stretch: 88%; font-weight: 700; font-size: 22px; margin-bottom: 12px; }
.or { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 18px 0; display: flex; align-items: center; gap: 12px; max-width: 640px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
table.plain { border-collapse: collapse; width: 100%; font-size: 16px; }
table.plain th, table.plain td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.plain th { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.scroll { overflow-x: auto; }
select { background: #fff; border: 1.5px solid var(--ink); padding: 5px 8px; font-family: var(--mono); font-size: 13px; border-radius: 0; }

.foot { padding: 26px 0 60px; }
.foot p { display: inline-block; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12px; padding: 8px 12px; margin: 0; }
.foot a { color: #fff; }

@media (max-width: 720px) {
  .jgb { grid-template-columns: 1fr; }
  .tab { padding: 11px 11px 9px; font-size: 11.5px; letter-spacing: .06em; }
  .tab[aria-current="page"] { padding-bottom: 13px; }
  body { font-size: 17px; }
  .prose { font-size: 19px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tab, .votes button, a { transition: color .12s, background-color .12s, border-color .12s; }
}
</style>

<script>
/* ------------------------------------------------------------------ *

 *  (everything works, but is saved only in the visitor's browser).
 *  Fill them in to switch the site to live accounts and shared posts.
 *  The anon key is designed to be public; access is enforced by the
 *  row-level rules in schema.sql.
 * ------------------------------------------------------------------ */
const CONFIG = {
  supabaseUrl: "https://qwzxkegvtzotnqzymbwq.supabase.co",
  supabaseAnonKey: "sb_publishable_ZjB4zPlSTgOMF5GDyuOJEw_j5rhlGLf",   // publishable key: public by design
  xSignIn: false            // set true once the X provider is switched on in Supabase
};
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js";

/* ---------- small helpers ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Markdown, deliberately small: paragraphs, ## headings, > quotes, lists, links, bold, italic, code, --- */
function mdInline(s) {
  const keep = [];
  const stash = html => { keep.push(html); return "\u0000" + (keep.length - 1) + "\u0000"; };
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m, c) => stash("<code>" + c + "</code>"));
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => stash('<a href="' + u + '" target="_blank" rel="noopener nofollow">' + t + "</a>"));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, (m, p, u) => p + stash('<a href="' + u + '" target="_blank" rel="noopener nofollow">' + u + "</a>"));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[+i]);
}
function md(src) {
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  const out = []; let para = [], list = null, quote = [];
  const flushP = () => { if (para.length) { out.push("<p>" + mdInline(para.join(" ")) + "</p>"); para = []; } };
  const flushL = () => { if (list) { out.push("<" + list.t + ">" + list.items.map(i => "<li>" + mdInline(i) + "</li>").join("") + "</" + list.t + ">"); list = null; } };
  const flushQ = () => { if (quote.length) { out.push("<blockquote>" + md(quote.join("\n")) + "</blockquote>"); quote = []; } };
  const flush = () => { flushP(); flushL(); flushQ(); };
  for (const raw of lines) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flush(); continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); quote.push(m[1]); continue; }
    flushQ();
    if ((m = line.match(/^(#{1,3})\s+(.+)$/))) { flush(); const t = m[1].length === 3 ? "h3" : "h2"; out.push("<" + t + ">" + mdInline(m[2]) + "</" + t + ">"); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flush(); out.push("<hr>"); continue; }

}
const plain = s => String(s || "").replace(/^#{1,3} .*$/gm, "").replace(/^-{3,}$/gm, "").replace(/[#>*_`]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
const words = s => (String(s || "").trim().match(/\S+/g) || []).length;
const readTime = n => Math.max(1, Math.round(n / 230)) + " min read";
const longDate = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
function ago(d) {
  const s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return longDate(d);
}
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70) || "essay";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(16).slice(2) + Date.now().toString(16));
const siteBase = () => location.origin + location.pathname;
const shareUrl = (text, hash) => "https://x.com/intent/post?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(siteBase() + "#" + hash);

/* =====================================================================

 * ===================================================================== */

function previewApi() {
  const KEY = "ballardian-preview-v1";
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!db || !db.v) db = seed();

    async init(cb) {
      listener = cb;
      const r = await sb.auth.getSession();

    async updateProfile(f) {

        h("tbody", null, members.map(m => { const sel = h("select", { "aria-label": "Role for " + m.handle, disabled: m.id === me.id, onchange: () => run(sel, ast, async () => { await api.setRole(m.id, sel.value); setStatus(ast, m.handle + " is now " + sel.value + ".", "ok"); }) }, ["member", "writer", "admin"].map(r => h("option", { value: r, selected: m.role === r }, r)));
          return h("tr", null, h("td", null, m.display_name), h("td", null, m.handle), h("td", null, m.x_handle ? "@" + m.x_handle : "–"), h("td", null, sel)); })))), ast));
    const sst = h("p", { class: "status", role: "status" });
    out.push(h("section", { class: "panel" }, h("h2", null, "Email subscribers (" + subs.length + ")"),
      subs.length ? h("div", { class: "row" }, h("button", { class: "btn ghost small", type: "button", onclick: async () => { try { await navigator.clipboard.writeText(subs.join("\n")); setStatus(sst, "Copied " + subs.length + " addresses.", "ok"); } catch (e) { setStatus(sst, subs.join(", ")); } } }, "Copy all addresses")) : h("p", { class: "hint", style: "margin:0" }, "Nobody has subscribed yet."), sst));
  }
  return out;
}

function notFound(msg, href, label) { return [h("p", { class: "empty" }, msg), h("a", { class: "btn", href }, label)]; }
function gate(msg) { return [h("p", { class: "empty" }, msg), h("a", { class: "btn", href: "#account" }, "Sign in")]; }

/* ---------- Router ---------- */
function route() {
  let x = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!x || x.includes("=") || x.includes("/")) return { tab: "essays", fn: viewEssays };   // also swallows auth redirects
  if (x === "essays") return { tab: "essays", fn: viewEssays };
  if (x === "threads") return { tab: "threads", fn: viewThreads };
  if (x === "ballard") return { tab: "ballard", fn: viewBallard };
  if (x === "account") return { tab: "account", fn: viewAccount };
  if (x === "write") return { tab: "essays", fn: () => viewWrite(null) };
  if (x.startsWith("edit-")) return { tab: "essays", fn: () => viewWrite(x.slice(5)) };
  if (x.startsWith("essay-")) return { tab: "essays", fn: () => viewEssay(x.slice(6)) };
  if (x.startsWith("thread-")) return { tab: "threads", fn: () => viewThread(x.slice(7)) };
  return { tab: "essays", fn: viewEssays };
}
async function render() {
  const r = route(), token = ++state.token, me = api.me();
  document.title = "Ballardian";
  for (const a of document.querySelectorAll("#tabs .tab")) { if (a.dataset.tab === r.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  const at = document.getElementById("acct-tab");
  at.replaceChildren(...(me ? [h("span", { class: "dot" }), me.display_name || me.handle] : ["Sign in"]));
  try {
    const out = await r.fn();
    if (token !== state.token) return;
    view.replaceChildren(...[].concat(out).filter(Boolean));
  } catch (e) {
    if (token !== state.token) return;
    view.replaceChildren(h("p", { class: "empty" }, "This page could not load. " + (e.message || "")), h("button", { class: "btn", type: "button", onclick: render }, "Try again"));
  }
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => { lastHash = location.hash; render().then(() => window.scrollTo(0, 0)); });

(async function start() {
  const live = !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey);
  try { api = live ? await liveApi() : previewApi(); }
  catch (e) { api = previewApi(); }
  if (api.mode === "preview") { const n = document.getElementById("notice"); n.hidden = false; n.append(h("b", null, "Preview. "), "Accounts open shortly. Until then, anything you post is saved only in this browser."); }
  const authError = (location.hash.match(/error_description=([^&]+)/) || [])[1];
  try { await api.init(() => render()); } catch (e) {}
  if (location.hash.includes("access_token=") || authError) history.replaceState(null, "", location.pathname + location.search);
  if (authError) { const n = document.getElementById("notice"); n.hidden = false; n.replaceChildren(h("b", null, "Sign-in did not complete. "), decodeURIComponent(authError.replace(/\+/g, " ")) + ". Ask for a new link from the Sign in tab."); }
  if (!state.token) render();
})();
</script>
